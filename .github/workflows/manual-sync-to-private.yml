name: Manual sync to private repo

# Manually triggered workflow that diffs packages/ between this community repo
# and the private nTopology/Utilities repo, then pushes any new, changed, or
# removed packages to a branch on the private repo and opens a follow-up PR
# there.
#
# Deletions only propagate for packages the private repo got from community
# in the first place (manifest.json has "communitySource": true) - private-only
# content (internal assets, test files) is left untouched even if it has no
# community-side counterpart.
#
# Required secret on this repo:
#   PRIVATE_REPO_TOKEN  - fine-grained PAT, repo access "nTopology/Utilities",
#                         permissions: Contents: read & write, Pull requests: read & write.

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Optional notes for the PR description'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout community repo (main)
        uses: actions/checkout@v5
        with:
          ref: main
          path: community
          lfs: true

      - name: Checkout private Utilities repo
        uses: actions/checkout@v5
        with:
          repository: nTopology/Utilities
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          fetch-depth: 0
          lfs: true

      - name: Diff packages and collect changed folders
        id: diff
        run: |
          set -euo pipefail

          changed=""

          for pkg_path in community/packages/*/*; do
            [ -d "$pkg_path" ] || continue

            # e.g. packages/Sileom/sileom-simulate
            rel="${pkg_path#community/}"

            # rsync dry-run: list files that would be transferred (no --delete,
            # private repo may contain extra files not present in community)
            delta=$(rsync -avn "$pkg_path/" "private/$rel/" 2>/dev/null || true)

            # If rsync reports any file changes (skip the summary lines)
            if echo "$delta" | grep -qvE '^(sending|sent|total|$)'; then
              echo "Changed: $rel"
              changed="$changed $rel"
            fi
          done

          if [ -z "$changed" ]; then
            : > /tmp/changed_packages.txt
          else
            echo "$changed" | xargs -n1 > /tmp/changed_packages.txt
            echo "Packages to sync:"
            cat /tmp/changed_packages.txt
          fi

          # Packages present in private that no longer exist in community.
          # Only ones private got from community originally (communitySource:
          # true) are eligible - private-only content is never auto-deleted.
          removed=""
          for pkg_path in private/packages/*/*; do
            [ -d "$pkg_path" ] || continue
            rel="${pkg_path#private/}"
            if [ -f "$pkg_path/manifest.json" ] \
              && jq -e '.communitySource == true' "$pkg_path/manifest.json" >/dev/null 2>&1 \
              && [ ! -d "community/$rel" ]; then
              echo "Removed in community: $rel"
              removed="$removed $rel"
            fi
          done

          if [ -z "$removed" ]; then
            : > /tmp/removed_packages.txt
          else
            echo "$removed" | xargs -n1 > /tmp/removed_packages.txt
            echo "Packages to remove:"
            cat /tmp/removed_packages.txt
          fi

          if [ -s /tmp/changed_packages.txt ] || [ -s /tmp/removed_packages.txt ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No differences found between community and private. Nothing to sync."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if nothing to sync
        if: steps.diff.outputs.has_changes != 'true'
        run: echo "Nothing to sync." && exit 0

      - name: Push changed packages to private repo branch
        if: steps.diff.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          NOTES: ${{ inputs.notes }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          cd private
          git config user.name  "$ACTOR"
          git config user.email "$ACTOR@users.noreply.github.com"

          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BRANCH="sync/manual-${TIMESTAMP}"
          git checkout -B "$BRANCH"

          # Sync .gitattributes so LFS tracking rules (*.exe, *.msi) are
          # present in the private repo before large files are committed.
          if [ -f "../community/.gitattributes" ]; then
            cp "../community/.gitattributes" .gitattributes
            git add .gitattributes
          fi

          while IFS= read -r pkg; do
            [ -n "$pkg" ] || continue
            mkdir -p "$pkg"

            # featured/verified are private-repo-only controls; the community
            # manifest never sets them. Preserve whatever's already there
            # before rsync overwrites manifest.json wholesale.
            PRESERVE="{}"
            if [ -f "$pkg/manifest.json" ]; then
              PRESERVE=$(jq -c '{featured, verified} | with_entries(select(.value != null))' "$pkg/manifest.json")
            fi

            rsync -av "../community/$pkg/" "$pkg/"

            if [ -f "$pkg/manifest.json" ]; then
              # Stamp communitySource so the private repo knows this package
              # originated from the community repo (used for commit history link),
              # and restore the preserved private-only fields.
              jq --argjson preserve "$PRESERVE" '. + {"communitySource": true} + $preserve' \
                "$pkg/manifest.json" > /tmp/_manifest.json \
                && mv /tmp/_manifest.json "$pkg/manifest.json"
            fi
            git add "$pkg"
          done < /tmp/changed_packages.txt

          while IFS= read -r pkg; do
            [ -n "$pkg" ] || continue
            echo "Removing package deleted from community: $pkg"
            git rm -r --ignore-unmatch --quiet "$pkg"
          done < /tmp/removed_packages.txt

          if git diff --cached --quiet; then
            echo "No effective changes after sync."
            exit 0
          fi

          # Build commit message listing all synced/removed packages
          COMMIT_MSG="Manual sync from Utilities-community\n"
          if [ -s /tmp/changed_packages.txt ]; then
            PKG_LIST=$(sed 's/^/  - /' /tmp/changed_packages.txt)
            COMMIT_MSG="${COMMIT_MSG}\nSynced packages:\n${PKG_LIST}\n"
          fi
          if [ -s /tmp/removed_packages.txt ]; then
            REMOVED_LIST=$(sed 's/^/  - /' /tmp/removed_packages.txt)
            COMMIT_MSG="${COMMIT_MSG}\nRemoved packages:\n${REMOVED_LIST}\n"
          fi
          COMMIT_MSG="${COMMIT_MSG}\nTriggered by: ${ACTOR}"
          git commit -m "$(printf '%b' "$COMMIT_MSG")"

          git push -u origin "$BRANCH" --force

          # Build PR body
          BODY="Manual sync from \`nTopology/Utilities-community\` triggered by @${ACTOR}."
          if [ -s /tmp/changed_packages.txt ]; then
            PKG_BODY=$(sed 's/^/- /' /tmp/changed_packages.txt)
            BODY="${BODY}\n\n**Packages synced:**\n${PKG_BODY}"
          fi
          if [ -s /tmp/removed_packages.txt ]; then
            REMOVED_BODY=$(sed 's/^/- /' /tmp/removed_packages.txt)
            BODY="${BODY}\n\n**Packages removed:**\n${REMOVED_BODY}"
          fi
          NOTES_LINE=""
          if [ -n "$NOTES" ]; then NOTES_LINE="\n\n**Notes:** ${NOTES}"; fi
          BODY="${BODY}${NOTES_LINE}"

          # Check if PR already exists for this branch
          EXISTING=$(gh pr list --repo nTopology/Utilities --head "$BRANCH" --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING" ]; then
            echo "PR already exists: #$EXISTING"
            exit 0
          fi

          gh pr create \
            --repo nTopology/Utilities \
            --base main \
            --head "$BRANCH" \
            --title "[manual sync] Community packages $(date +%Y-%m-%d)" \
            --body "$BODY"
